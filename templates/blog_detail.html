{% extends "base.html" %}
{% block title %}{{ post.title }} — Venkatesan G{% endblock %}
{% block content %}
<section style="padding:80px 0">
  <div class="container" style="max-width:760px">
    <a href="{{ url_for('blog') }}">← Back to Blog</a>
    <h1 style="margin-top:16px">{{ post.title }}</h1>
    <div style="color:#888;font-size:.85rem">{{ post.date_posted.strftime('%B %d, %Y') }}</div>
    <div style="margin-top:32px;line-height:1.8">{{ post.content|safe }}</div>
  </div>
</section>
{% endblock %}
