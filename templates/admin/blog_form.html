{% extends "base.html" %}
{% block title %}{{ 'Edit' if post.id else 'New' }} Blog Post — Admin{% endblock %}
{% block content %}
<section style="padding:60px 0">
  <div class="container" style="max-width:760px">
    <a href="{{ url_for('admin_dashboard') }}" style="color:var(--accent);text-decoration:none">← Back to Dashboard</a>
    <h1 style="margin-top:16px">{{ 'Edit' if post.id else 'New' }} Blog Post</h1>

    <form method="POST" class="form" style="margin-top:24px">

      <label for="title">Title</label>
      <input id="title" name="title" type="text"
             value="{{ post.title or '' }}" required>

      <label for="summary">Summary</label>
      <textarea id="summary" name="summary" rows="3"
                placeholder="Short one-line summary shown on the blog list">{{ post.summary or '' }}</textarea>

      <label for="content">Content (HTML or Markdown)</label>
      <textarea id="content" name="content" rows="16" required
                placeholder="Write your post here. HTML is allowed.">{{ post.content or '' }}</textarea>

      <label style="display:flex;align-items:center;gap:8px;margin-top:16px;margin-bottom:24px">
        <input type="checkbox" name="is_published" style="width:auto"
               {% if post.is_published %}checked{% endif %}>
        Published (visible on the public blog page)
      </label>

      <div style="display:flex;gap:12px;margin-top:24px">
        <button type="submit" class="btn btn-primary">Save Post</button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-ghost">Cancel</a>
      </div>

    </form>
  </div>
</section>
{% endblock %}
