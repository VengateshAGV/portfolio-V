{% extends "base.html" %}
{% block title %}Change Password — Admin{% endblock %}
{% block content %}
<section style="padding:60px 0">
  <div class="container" style="max-width:480px">
    <a href="{{ url_for('admin_dashboard') }}" style="color:var(--accent);text-decoration:none">← Back to Dashboard</a>
    <h1 style="margin-top:16px">Change Password</h1>

    <form method="POST" class="form" style="margin-top:24px">
      <label>Current Password</label>
      <input name="current_password" type="password" required autocomplete="current-password">

      <label>New Password</label>
      <input name="new_password" type="password" required minlength="6" autocomplete="new-password">

      <label>Confirm New Password</label>
      <input name="confirm_password" type="password" required minlength="6" autocomplete="new-password">

      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:24px">
        Update Password
      </button>
    </form>
  </div>
</section>
{% endblock %}
